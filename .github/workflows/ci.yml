name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs (tag in the comment); Dependabot keeps them current.
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # Core requirements only: tests mock the models, so no torch or weights are needed.
      - run: pip install -r requirements.txt
      - name: Import check
        run: python -c "import main; print('app routes:', len(main.app.routes))"
        env:
          SEED_SAMPLES: "false"
      - run: pytest -q
      # Offline evals: stub segmentation model, no weights, no API keys. Gated checks fail the job.
      - name: Evals (deterministic)
        run: |
          python ../evals/run_evals.py --out-dir "$RUNNER_TEMP/evals" || status=$?
          cat "$RUNNER_TEMP/evals/results.md" >> "$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install scanners
        run: pip install pip-audit==2.10.1 bandit==1.9.4
      - name: Python dependency audit
        run: |
          pip-audit -r backend/requirements.txt
          pip-audit -r backend/requirements-models.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: npm dependency audit (runtime dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Bandit (Python SAST)
        run: bandit -q -r backend scripts evals -x backend/tests
      - name: Gitleaks (full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
